<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品智能问答 Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #ff6b35;
            --primary-light: #ff8c5e;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --border: #e1e8ed;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-hover: 0 4px 20px rgba(0,0,0,0.1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 头部 */
        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            box-shadow: var(--shadow);
            z-index: 10;
        }
        header h1 {
            font-size: 20px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        header .subtitle {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 4px;
        }

        /* 消息区 */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }
        .msg {
            margin-bottom: 24px;
            animation: fadein 0.3s ease;
        }
        @keyframes fadein {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user {
            display: flex;
            justify-content: flex-end;
        }
        .msg.user .bubble {
            background: var(--primary);
            color: white;
            padding: 12px 16px;
            border-radius: 18px 18px 4px 18px;
            max-width: 70%;
            line-height: 1.5;
        }
        .msg.agent .bubble {
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 4px 18px 18px 18px;
            box-shadow: var(--shadow);
            max-width: 85%;
            line-height: 1.7;
        }

        /* 状态指示 */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-light);
            font-size: 14px;
            padding: 8px 0;
        }
        .status .spinner {
            width: 14px; height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 解析结果折叠区 */
        .parsed-detail {
            background: #f8f9fa;
            border-left: 3px solid var(--primary);
            padding: 10px 14px;
            margin: 8px 0 12px;
            border-radius: 4px;
            font-size: 13px;
        }
        .parsed-detail .label {
            color: var(--text-light);
            margin-right: 6px;
        }
        .parsed-detail code {
            background: #e9ecef;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 12px;
            color: var(--primary);
        }
        .parsed-detail .extracted-tag {
            display: inline-block;
            background: #fff3e0;
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin: 2px 4px 2px 0;
        }

        /* 商品卡片 */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin: 12px 0;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .product-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
            border-color: var(--primary-light);
        }
        .product-card img {
            width: 100%;
            height: 140px;
            object-fit: contain;
            background: #fafafa;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .product-card .title {
            font-size: 13px;
            line-height: 1.4;
            height: 36px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 6px;
        }
        .product-card .brand {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 4px;
        }
        .product-card .price {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
        }
        .product-card .price.unknown { color: var(--text-light); font-size: 13px; font-weight: normal; }
        .product-card .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            font-size: 11px;
            color: var(--text-light);
        }
        .product-card .score {
            background: #fff3e0;
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 600;
        }

        /* 答案文本 */
        .answer {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .answer strong { color: var(--text); }
        .cursor {
            display: inline-block;
            width: 8px;
            background: var(--primary);
            animation: blink 1s infinite;
            margin-left: 2px;
            vertical-align: middle;
            height: 16px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* 错误 */
        .error {
            color: #e74c3c;
            background: #fdf0ef;
            padding: 10px 14px;
            border-radius: 6px;
            border-left: 3px solid #e74c3c;
        }

        /* 输入区 */
        #input-area {
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
        }
        #input-area form {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }
        #query-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        #query-input:focus { border-color: var(--primary); }
        #query-input:disabled { background: #f5f5f5; cursor: not-allowed; }
        #send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        #send-btn:hover:not(:disabled) { background: var(--primary-light); }
        #send-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* 滚动条 */
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: #d0d7de; border-radius: 3px; }
        #messages::-webkit-scrollbar-thumb:hover { background: #afb8c1; }
    </style>
</head>
<body>
    <header>
        <h1>🛒 商品智能问答 Agent</h1>
        <div class="subtitle">自然语言提问 → 混合检索 → 智能推荐（支持中英文）</div>
    </header>

    <div id="messages">
        <div class="msg agent">
            <div class="bubble">
                你好！我是商品推荐助手。可以试试这些查询：
                <ul style="margin: 8px 0 0 20px; color: var(--text-light);">
                    <li>推荐一款蓝牙耳机</li>
                    <li>Nike 的运动鞋，预算100美元</li>
                    <li>200美元以内适合徒步的红色背包</li>
                    <li>waterproof jacket under 100 dollars</li>
                </ul>
            </div>
        </div>
    </div>

    <div id="input-area">
        <form id="chat-form">
            <input type="text" id="query-input" placeholder="输入你的商品查询..." autocomplete="off" autofocus>
            <button type="submit" id="send-btn">发送</button>
        </form>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const formEl = document.getElementById('chat-form');
        const inputEl = document.getElementById('query-input');
        const sendBtn = document.getElementById('send-btn');

        function scrollBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg user';
            div.innerHTML = `<div class="bubble"></div>`;
            div.querySelector('.bubble').textContent = text;
            messagesEl.appendChild(div);
            scrollBottom();
        }

        function createAgentMessage() {
            const div = document.createElement('div');
            div.className = 'msg agent';
            div.innerHTML = '<div class="bubble"></div>';
            messagesEl.appendChild(div);
            return div.querySelector('.bubble');
        }

        function renderStatus(bubble, text) {
            // 不销毁已有内容：找现有 status 元素更新，没有就新建追加
            let statusEl = bubble.querySelector('.status');
            if (!statusEl) {
                statusEl = document.createElement('div');
                statusEl.className = 'status';
                statusEl.innerHTML = '<div class="spinner"></div><span class="status-text"></span>';
                bubble.appendChild(statusEl);
            }
            statusEl.querySelector('.status-text').textContent = text;
            scrollBottom();
        }

        function renderParsed(bubble, data) {
            const detail = document.createElement('div');
            detail.className = 'parsed-detail';
            let html = `<div><span class="label">语义查询：</span><code></code></div>`;
            const extracted = data.extracted || {};
            const tags = [];
            for (const [k, v] of Object.entries(extracted)) {
                if (v !== null && v !== undefined && v !== '') {
                    tags.push(`<span class="extracted-tag">${k}: ${v}</span>`);
                }
            }
            if (tags.length) {
                html += `<div style="margin-top:6px"><span class="label">结构化条件：</span>${tags.join('')}</div>`;
            }
            detail.innerHTML = html;
            detail.querySelector('code').textContent = data.semantic_query || '';
            bubble.appendChild(detail);
            scrollBottom();
        }

        function renderProducts(bubble, products) {
            if (!products || !products.length) return;
            const grid = document.createElement('div');
            grid.className = 'products';
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                const priceStr = (p.price && p.price > 0)
                    ? `<span class="price">$${p.price.toFixed(2)}</span>`
                    : `<span class="price unknown">价格待定</span>`;
                const ratingStr = p.average_rating > 0 ? `★ ${p.average_rating.toFixed(1)}` : '';
                const imgHtml = p.image
                    ? `<img src="${escapeHtml(p.image)}" onerror="this.style.display='none'" loading="lazy">`
                    : `<img style="display:none">`;
                card.innerHTML = `
                    ${imgHtml}
                    <div class="title"></div>
                    <div class="brand"></div>
                    <div>${priceStr}</div>
                    <div class="meta">
                        <span>${escapeHtml(ratingStr)}</span>
                        <span class="score">${(p.final_score * 100).toFixed(0)}%</span>
                    </div>
                `;
                card.querySelector('.title').textContent = p.title || '';
                card.querySelector('.brand').textContent = p.brand || '';
                card.addEventListener('click', () => {
                    if (p.image) window.open(p.image, '_blank');
                });
                grid.appendChild(card);
            });
            bubble.appendChild(grid);
            scrollBottom();
        }

        function createAnswerArea(bubble) {
            const ans = document.createElement('div');
            ans.className = 'answer';
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            ans.appendChild(cursor);
            bubble.appendChild(ans);
            return { ans, cursor };
        }

        function appendToken(ans, cursor, token) {
            ans.insertBefore(document.createTextNode(token), cursor);
            scrollBottom();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function renderError(bubble, msg) {
            const err = document.createElement('div');
            err.className = 'error';
            err.textContent = '出错了：' + msg;
            bubble.appendChild(err);
            scrollBottom();
        }

        async function sendQuery(query) {
            addUserMessage(query);
            const bubble = createAgentMessage();
            inputEl.disabled = true;
            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, top_k: 5 }),
                });

                if (!response.ok) {
                    const errText = await response.text();
                    renderError(bubble, `HTTP ${response.status}: ${errText}`);
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let answerArea = null;
                let answerStarted = false;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    // SSE 事件以 \n\n 分隔
                    let idx;
                    while ((idx = buffer.indexOf('\n\n')) >= 0) {
                        const rawEvent = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        const evt = parseSSE(rawEvent);
                        if (!evt) continue;

                        switch (evt.event) {
                            case 'status':
                                // 答案区创建后忽略后续 status（光标已表示生成中）
                                if (!answerStarted) {
                                    renderStatus(bubble, evt.data);
                                }
                                break;
                            case 'parsed':
                                try {
                                    renderParsed(bubble, JSON.parse(evt.data));
                                } catch (e) { /* ignore */ }
                                break;
                            case 'retrieved':
                                try {
                                    renderProducts(bubble, JSON.parse(evt.data));
                                } catch (e) { /* ignore */ }
                                // 清除 status，创建答案区
                                const statusEl = bubble.querySelector('.status');
                                if (statusEl) statusEl.remove();
                                const obj = createAnswerArea(bubble);
                                answerArea = obj;
                                answerStarted = true;
                                break;
                            case 'token':
                                if (answerArea) {
                                    appendToken(answerArea.ans, answerArea.cursor, evt.data);
                                }
                                break;
                            case 'done':
                                if (answerArea && answerArea.cursor) {
                                    answerArea.cursor.remove();
                                }
                                bubble.querySelectorAll('.status').forEach(el => el.remove());
                                break;
                            case 'error':
                                renderError(bubble, evt.data);
                                break;
                        }
                    }
                }
            } catch (e) {
                renderError(bubble, e.message || String(e));
            } finally {
                inputEl.disabled = false;
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        function parseSSE(raw) {
            const lines = raw.split('\n');
            let event = 'message';
            const dataLines = [];
            for (const line of lines) {
                if (line.startsWith('event:')) {
                    event = line.slice(6).trim();
                } else if (line.startsWith('data:')) {
                    dataLines.push(line.slice(5).replace(/^ /, ''));
                }
            }
            return { event, data: dataLines.join('\n') };
        }

        formEl.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = inputEl.value.trim();
            if (!query) return;
            inputEl.value = '';
            sendQuery(query);
        });
    </script>
</body>
</html>
