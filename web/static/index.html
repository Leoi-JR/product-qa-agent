<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品智能问答 Agent</title>
    <!-- 引入 marked.js 用于渲染 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            /* 电商风格主题色：活力红/橙 */
            --primary: #ff4d4f;
            --primary-light: #ff7875;
            --primary-fade: #fff1f0;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #1f2329;
            --text-regular: #4e5969;
            --text-light: #86909c;
            --border: #e5e6eb;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius-lg: 16px;
            --radius-md: 8px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 头部 */
        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            box-shadow: var(--shadow-sm);
            z-index: 10;
            text-align: center;
        }
        header h1 {
            font-size: 22px;
            font-weight: 600;
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        header .subtitle {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 6px;
        }

        /* 消息区 */
        #messages {
            flex: 1;
            overflow-y: auto;
            width: 100%;
        }
        #messages-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .msg {
            animation: fadein 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        @keyframes fadein {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user {
            align-items: flex-end;
        }
        .msg.user .bubble {
            background: linear-gradient(135deg, var(--primary), #ff6b6b);
            color: white;
            padding: 12px 18px;
            border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
            max-width: 75%;
            font-size: 15px;
            line-height: 1.6;
            box-shadow: 0 4px 10px rgba(255, 77, 79, 0.2);
        }
        .msg.agent {
            align-items: flex-start;
        }
        .msg.agent .bubble {
            background: var(--card-bg);
            padding: 18px 24px;
            border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            max-width: 85%;
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-main);
        }

        /* 状态指示 */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-light);
            font-size: 14px;
            padding: 4px 0;
        }
        .status .spinner {
            width: 16px; height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 解析结果折叠区 (默认隐藏) */
        details.parsed-detail {
            background: #fafbfc;
            border: 1px solid var(--border);
            margin: 12px 0 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            overflow: hidden;
            transition: all 0.3s;
        }
        details.parsed-detail summary {
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-regular);
            user-select: none;
            outline: none;
            background: #f4f6f8;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        details.parsed-detail summary:hover {
            color: var(--primary);
        }
        .parsed-content {
            padding: 12px 14px;
            border-top: 1px solid var(--border);
        }
        .parsed-detail .label {
            color: var(--text-light);
            margin-right: 6px;
            font-weight: 500;
        }
        .parsed-detail code {
            background: var(--primary-fade);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--primary);
            font-family: monospace;
        }
        .parsed-detail .extracted-tag {
            display: inline-block;
            background: #e8f3ff;
            color: #1677ff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin: 4px 6px 4px 0;
            border: 1px solid #bae0ff;
        }

        /* 商品卡片 - 电商风格美化 */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin: 16px 0;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .product-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-4px);
            border-color: var(--primary-light);
        }
        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            background: #fff;
            border-radius: 6px;
            margin-bottom: 12px;
            mix-blend-mode: multiply;
        }
        .product-card .price-row {
            display: flex;
            align-items: baseline;
            gap: 4px;
            margin-bottom: 8px;
        }
        .product-card .price-symbol {
            font-size: 14px;
            color: var(--primary);
            font-weight: 600;
        }
        .product-card .price {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
        }
        .product-card .price.unknown { 
            color: var(--text-light); 
            font-size: 14px; 
            font-weight: normal; 
        }
        .product-card .title {
            font-size: 14px;
            line-height: 1.5;
            height: 42px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 8px;
            color: var(--text-main);
            font-weight: 500;
        }
        .product-card .brand {
            font-size: 12px;
            color: var(--text-light);
            background: #f4f6f8;
            padding: 2px 6px;
            border-radius: 4px;
            align-self: flex-start;
            margin-bottom: 8px;
        }
        .product-card .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            font-size: 12px;
            color: #faad14;
            font-weight: 600;
        }

        /* 答案文本 */
        .answer {
            color: var(--text-main);
        }
        /* Markdown 样式 */
        .answer p { margin-bottom: 12px; }
        .answer p:last-child { margin-bottom: 0; }
        .answer strong { color: #000; font-weight: 600; }
        .answer ul, .answer ol { margin-left: 20px; margin-bottom: 12px; }
        .answer li { margin-bottom: 4px; }
        .answer code {
            background: #f4f6f8;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
            color: var(--primary);
        }
        .answer pre {
            background: #f4f6f8;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin-bottom: 12px;
        }
        .answer pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        .cursor {
            display: inline-block;
            width: 6px;
            height: 15px;
            background: var(--primary);
            animation: blink 1s infinite;
            margin-left: 4px;
            vertical-align: middle;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* 错误 */
        .error {
            color: #e74c3c;
            background: #fdf0ef;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border-left: 4px solid #e74c3c;
            font-size: 14px;
            margin-top: 8px;
        }

        /* 输入区 */
        #input-area {
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            padding: 20px 24px;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.03);
            z-index: 10;
        }
        #input-area form {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 16px;
        }
        #query-input {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid var(--border);
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
            background: #f9fafb;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
        }
        #query-input:focus { 
            border-color: var(--primary); 
            background: #ffffff;
            box-shadow: 0 0 0 3px var(--primary-fade);
        }
        #query-input:disabled { background: #f5f5f5; cursor: not-allowed; }
        #send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 32px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(255, 77, 79, 0.2);
        }
        #send-btn:hover:not(:disabled) { 
            background: var(--primary-light); 
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(255, 77, 79, 0.3);
        }
        #send-btn:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(255, 77, 79, 0.2);
        }
        #send-btn:disabled { 
            background: #e5e6eb; 
            color: #86909c;
            box-shadow: none;
            cursor: not-allowed; 
        }

        /* 滚动条 */
        #messages::-webkit-scrollbar { width: 8px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: #c9cdd4; border-radius: 4px; }
        #messages::-webkit-scrollbar-thumb:hover { background: #86909c; }
    </style>
</head>
<body>
    <header>
        <h1>🛍️ 商品智能问答 Agent</h1>
        <div class="subtitle">自然语言提问 · 混合检索 · 智能推荐</div>
    </header>

    <div id="messages">
        <div id="messages-inner">
            <div class="msg agent">
                <div class="bubble">
                    <p style="margin-bottom: 10px;">你好！我是商品智能推荐助手。可以试试这些查询：</p>
                    <ul style="color: var(--text-regular);">
                        <li>推荐一款续航好、降噪强的蓝牙耳机</li>
                        <li>Nike 的运动鞋，预算100美元以内</li>
                        <li>200美元以内适合徒步的红色背包</li>
                        <li>waterproof jacket under 100 dollars</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div id="input-area">
        <form id="chat-form">
            <input type="text" id="query-input" placeholder="输入你想找的商品（例如：推荐一款适合送礼的机械键盘...）" autocomplete="off" autofocus>
            <button type="submit" id="send-btn">发送</button>
        </form>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const messagesInnerEl = document.getElementById('messages-inner');
        const formEl = document.getElementById('chat-form');
        const inputEl = document.getElementById('query-input');
        const sendBtn = document.getElementById('send-btn');

        // 配置 marked.js 支持换行
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        function scrollBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg user';
            div.innerHTML = `<div class="bubble"></div>`;
            div.querySelector('.bubble').textContent = text;
            messagesInnerEl.appendChild(div);
            scrollBottom();
        }

        function createAgentMessage() {
            const div = document.createElement('div');
            div.className = 'msg agent';
            div.innerHTML = '<div class="bubble"></div>';
            messagesInnerEl.appendChild(div);
            return div.querySelector('.bubble');
        }

        function renderStatus(bubble, text) {
            let statusEl = bubble.querySelector('.status');
            if (!statusEl) {
                statusEl = document.createElement('div');
                statusEl.className = 'status';
                statusEl.innerHTML = '<div class="spinner"></div><span class="status-text"></span>';
                bubble.appendChild(statusEl);
            }
            statusEl.querySelector('.status-text').textContent = text;
            scrollBottom();
        }

        function renderParsed(bubble, data) {
            const detail = document.createElement('details');
            detail.className = 'parsed-detail';
            let html = `<summary>💡 查看检索条件</summary><div class="parsed-content">`;
            html += `<div style="margin-bottom: 10px;"><span class="label">语义查询：</span><code>${escapeHtml(data.semantic_query || '')}</code></div>`;
            
            const extracted = data.extracted || {};
            const tags = [];
            for (const [k, v] of Object.entries(extracted)) {
                if (v !== null && v !== undefined && v !== '') {
                    tags.push(`<span class="extracted-tag">${escapeHtml(k)}: ${escapeHtml(v)}</span>`);
                }
            }
            if (tags.length) {
                html += `<div><span class="label">结构化条件：</span><br/>${tags.join('')}</div>`;
            }
            html += `</div>`;
            detail.innerHTML = html;
            bubble.appendChild(detail);
            scrollBottom();
        }

        function renderProducts(bubble, products) {
            if (!products || !products.length) return;
            const grid = document.createElement('div');
            grid.className = 'products';
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                let priceHtml = '';
                if (p.price && p.price > 0) {
                    priceHtml = `<div class="price-row"><span class="price-symbol">$</span><span class="price">${p.price.toFixed(2)}</span></div>`;
                } else {
                    priceHtml = `<div class="price-row"><span class="price unknown">价格待定</span></div>`;
                }
                
                const ratingStr = p.average_rating > 0 ? `⭐ ${p.average_rating.toFixed(1)}` : '';
                const imgHtml = p.image
                    ? `<img src="${escapeHtml(p.image)}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'><rect width=\\'100\\' height=\\'100\\' fill=\\'%23f4f6f8\\'/><text x=\\'50\\' y=\\'50\\' font-family=\\'Arial\\' font-size=\\'12\\' fill=\\'%2386909c\\' text-anchor=\\'middle\\' dy=\\'4\\'>暂无图片</text></svg>'" loading="lazy">`
                    : `<img style="display:none">`;
                    
                card.innerHTML = `
                    ${imgHtml}
                    ${priceHtml}
                    <div class="title">${escapeHtml(p.title || '')}</div>
                    ${p.brand ? `<div class="brand">${escapeHtml(p.brand)}</div>` : ''}
                    <div class="meta">
                        <span>${escapeHtml(ratingStr)}</span>
                        <!-- 隐藏相似度百分比 -->
                    </div>
                `;
                card.addEventListener('click', () => {
                    if (p.image) window.open(p.image, '_blank');
                });
                grid.appendChild(card);
            });
            bubble.appendChild(grid);
            scrollBottom();
        }

        function createAnswerArea(bubble) {
            const ans = document.createElement('div');
            ans.className = 'answer';
            bubble.appendChild(ans);
            return { ans, fullText: '' };
        }

        function appendToken(answerArea, token) {
            answerArea.fullText += token;
            let html = marked.parse(answerArea.fullText);
            
            // 在 HTML 结尾添加光标
            const cursorHtml = '<span class="cursor"></span>';
            if (html.trim().endsWith('</p>')) {
                html = html.replace(/(<\/p>)(?:\s*)$/, cursorHtml + '$1');
            } else {
                html += cursorHtml;
            }
            
            answerArea.ans.innerHTML = html;
            scrollBottom();
        }

        function finalizeAnswer(answerArea) {
            if (answerArea) {
                // 移除光标，只渲染纯文本的 markdown
                answerArea.ans.innerHTML = marked.parse(answerArea.fullText);
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function renderError(bubble, msg) {
            const err = document.createElement('div');
            err.className = 'error';
            err.textContent = '出错了：' + msg;
            bubble.appendChild(err);
            scrollBottom();
        }

        async function sendQuery(query) {
            addUserMessage(query);
            const bubble = createAgentMessage();
            inputEl.disabled = true;
            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, top_k: 5 }),
                });

                if (!response.ok) {
                    const errText = await response.text();
                    renderError(bubble, `HTTP ${response.status}: ${errText}`);
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let answerArea = null;
                let answerStarted = false;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    let idx;
                    while ((idx = buffer.indexOf('\n\n')) >= 0) {
                        const rawEvent = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        const evt = parseSSE(rawEvent);
                        if (!evt) continue;

                        switch (evt.event) {
                            case 'status':
                                if (!answerStarted) {
                                    renderStatus(bubble, evt.data);
                                }
                                break;
                            case 'parsed':
                                try {
                                    renderParsed(bubble, JSON.parse(evt.data));
                                } catch (e) { /* ignore */ }
                                break;
                            case 'retrieved':
                                try {
                                    renderProducts(bubble, JSON.parse(evt.data));
                                } catch (e) { /* ignore */ }
                                
                                const statusEl = bubble.querySelector('.status');
                                if (statusEl) statusEl.remove();
                                answerArea = createAnswerArea(bubble);
                                answerStarted = true;
                                break;
                            case 'token':
                                if (answerArea) {
                                    appendToken(answerArea, evt.data);
                                }
                                break;
                            case 'done':
                                finalizeAnswer(answerArea);
                                bubble.querySelectorAll('.status').forEach(el => el.remove());
                                break;
                            case 'error':
                                renderError(bubble, evt.data);
                                break;
                        }
                    }
                }
                
                // 确保在流结束后完成渲染（如果由于某些原因 done 事件没有被处理）
                if (answerArea) {
                    finalizeAnswer(answerArea);
                }
            } catch (e) {
                renderError(bubble, e.message || String(e));
            } finally {
                inputEl.disabled = false;
                sendBtn.disabled = false;
                inputEl.focus();
                scrollBottom();
            }
        }

        function parseSSE(raw) {
            const lines = raw.split('\n');
            let event = 'message';
            const dataLines = [];
            for (const line of lines) {
                if (line.startsWith('event:')) {
                    event = line.slice(6).trim();
                } else if (line.startsWith('data:')) {
                    dataLines.push(line.slice(5).replace(/^ /, ''));
                }
            }
            return { event, data: dataLines.join('\n') };
        }

        formEl.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = inputEl.value.trim();
            if (!query) return;
            inputEl.value = '';
            sendQuery(query);
        });
    </script>
</body>
</html>
